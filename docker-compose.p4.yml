# P4 opt-in overlay. Use together with the root Compose file:
#   docker compose -f docker-compose.yml -f docker-compose.p4.yml up --build
#
# Requires Docker Compose with merge tags (!reset). Validated with v5.6.0;
# upstream documents !reset from 2.24.0; the minimum version was not verified here.
#
# Only api-gateway publishes a host port. Sales, Inventory, BFF, Dispatch,
# Pagos and the simulated payment gateway stay internal.
# P4_GATEWAY_PUBLISHED_PORT selects that loopback host port (default 8080); the
# isolated runner uses 8081. The root docker-compose.yml contains P1-P3 and is
# not edited by this overlay.
# Pagos is the real payments-api in the root Compose; payment-gateway-sim is the
# official simulated external gateway. No payment admin or test DB ports are
# published by this overlay.

services:
  sales-api:
    ports: !reset []

  inventory-grpc:
    ports: !reset []

  toxiproxy:
    ports: !reset []

  sales-test-db:
    ports: !reset []

  payments-test-db:
    ports: !reset []

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      GATEWAY_SALES_BASE_URL: "http://sales-api:3000"
      GATEWAY_BFF_BASE_URL: "http://web-bff:3002"
      GATEWAY_JWT_SECRET: "${GATEWAY_JWT_SECRET:?GATEWAY_JWT_SECRET is required and must be at least 32 bytes}"
      GATEWAY_JWT_ISSUER: "${GATEWAY_JWT_ISSUER:-repuestossur-demo}"
      GATEWAY_JWT_AUDIENCE: "${GATEWAY_JWT_AUDIENCE:-repuestossur-gateway}"
      GATEWAY_SALES_API_KEY_READER: "${API_KEY_READER:-local-reader-key-for-demo}"
      GATEWAY_SALES_API_KEY_OPERATOR: "${API_KEY_OPERATOR:-local-operator-key-for-demo}"
      GATEWAY_SALES_TIMEOUT_MS: "${GATEWAY_SALES_TIMEOUT_MS:-10000}"
      GATEWAY_BFF_TIMEOUT_MS: "${GATEWAY_BFF_TIMEOUT_MS:-2500}"
      GATEWAY_RATE_LIMIT_WINDOW_MS: "${GATEWAY_RATE_LIMIT_WINDOW_MS:-60000}"
      GATEWAY_RATE_LIMIT_MAX_REQUESTS: "${GATEWAY_RATE_LIMIT_MAX_REQUESTS:-60}"
      GATEWAY_RATE_LIMIT_MAX_IDENTITIES: "${GATEWAY_RATE_LIMIT_MAX_IDENTITIES:-10000}"
      GATEWAY_MAX_REQUEST_BODY_BYTES: "${GATEWAY_MAX_REQUEST_BODY_BYTES:-1048576}"
      GATEWAY_MAX_RESPONSE_BODY_BYTES: "${GATEWAY_MAX_RESPONSE_BODY_BYTES:-2097152}"
    ports:
      - "127.0.0.1:${P4_GATEWAY_PUBLISHED_PORT:-8080}:8080"
    depends_on:
      sales-api:
        condition: service_started
      web-bff:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health', { signal: AbortSignal.timeout(2000) }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  web-bff:
    build:
      context: .
      dockerfile: apps/web-bff/Dockerfile
    environment:
      BFF_HOST: "0.0.0.0"
      BFF_PORT: "3002"
      BFF_PAYMENTS_BASE_URL: "${BFF_PAYMENTS_BASE_URL:-http://payments-api:3003}"
      BFF_DISPATCH_BASE_URL: "${BFF_DISPATCH_BASE_URL:-http://dispatch-api:3001}"
      BFF_SOURCE_TIMEOUT_MS: "${BFF_SOURCE_TIMEOUT_MS:-1500}"
      BFF_MAX_RESPONSE_BODY_BYTES: "${BFF_MAX_RESPONSE_BODY_BYTES:-2097152}"
    expose:
      - "3002"
    depends_on:
      dispatch-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health', { signal: AbortSignal.timeout(2000) }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
