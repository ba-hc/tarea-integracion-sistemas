# Overlay opcional de los runners aislados de P4 (tests/t2/p4-*.mjs).
#
# Desde la entrega final, el Compose raíz ya contiene Gateway y BFF y sólo
# publica el Gateway: `docker compose up --build` basta para la demo.
# Este overlay sólo existe para los runners aislados, que:
#   - exigen un GATEWAY_JWT_SECRET propio (sin el valor de demo), y
#   - publican el Gateway en P4_GATEWAY_PUBLISHED_PORT (por defecto 8080) para
#     convivir con otro stack en la misma máquina.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.p4.yml up --build
#
# Requiere Compose con etiquetas de merge (!override); validado con v5.6.0.

services:
  api-gateway:
    environment:
      GATEWAY_JWT_SECRET: "${GATEWAY_JWT_SECRET:?GATEWAY_JWT_SECRET is required and must be at least 32 bytes}"
    ports: !override
      - "127.0.0.1:${P4_GATEWAY_PUBLISHED_PORT:-8080}:8080"
