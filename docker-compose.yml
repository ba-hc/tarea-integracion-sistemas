services:
  sales-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales-local-only
    volumes:
      - sales-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 3s
      retries: 20

  inventory-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory-local-only
    volumes:
      - inventory-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20

  dispatch-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: dispatch
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch-local-only
    volumes:
      - dispatch-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  payments-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments-local-only
    volumes:
      - payments-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20

  inventory-grpc:
    build:
      context: .
      dockerfile: apps/inventory-grpc/Dockerfile
    environment:
      DATABASE_URL: postgresql://inventory:inventory-local-only@inventory-db:5432/inventory?schema=public
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
      LOG_FORMAT: json
    # Interno: sin puerto publicado. docker-compose.dev.yml lo publica en loopback
    # sólo para pruebas y experimentos de la T1.
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/src/health/health-probe.js"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  sales-api:
    build:
      context: .
      dockerfile: apps/sales-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://sales:sales-local-only@sales-db:5432/sales?schema=public
      HOST: 0.0.0.0
      PORT: 3000
      API_KEY_READER: ${API_KEY_READER:-local-reader-key-for-demo}
      API_KEY_OPERATOR: ${API_KEY_OPERATOR:-local-operator-key-for-demo}
      INVENTORY_GRPC_URL: ${INVENTORY_GRPC_URL:-inventory-grpc:50051}
      INVENTORY_RPC_DEADLINE_MS: ${INVENTORY_RPC_DEADLINE_MS:-800}
      INVENTORY_PROTO_PATH: /repo/contracts/grpc/repuestossur/inventory/v1/inventory.proto
      # T2 Saga (docs/t2/P3-SAGA.md): reservar stock -> cobrar -> despachar.
      # Subconjuntos (stock | stock,dispatch) sólo para pruebas aisladas.
      SAGA_STEPS: ${SAGA_STEPS:-stock,payment,dispatch}
      PAYMENTS_BASE_URL: ${PAYMENTS_BASE_URL:-http://payments-api:3003}
      DISPATCH_BASE_URL: http://dispatch-api:3001
      SALE_UNIT_PRICE_MINOR: ${SALE_UNIT_PRICE_MINOR:-10000}
      SALE_CURRENCY: CLP
    # Interno: sólo el API Gateway llega a Sales. docker-compose.dev.yml publica
    # 127.0.0.1:3000 para la suite black-box y el experimento de la T1.
    depends_on:
      sales-db:
        condition: service_healthy
      inventory-grpc:
        condition: service_healthy
      payments-api:
        condition: service_healthy
      dispatch-api:
        condition: service_healthy

  dispatch-api:
    build:
      context: .
      dockerfile: apps/dispatch-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://dispatch:dispatch-local-only@dispatch-db:5432/dispatch?schema=public
      HOST: 0.0.0.0
      PORT: 3001
      DISPATCH_FAIL_CREATE: "${DISPATCH_FAIL_CREATE:-false}"
    depends_on:
      dispatch-db:
        condition: service_healthy

  # T2-201: pasarela de pagos externa simulada. Modo normal|slow|down|decline,
  # cambiable en caliente con PUT /admin/config (docs/t2/P2-PAGOS.md).
  payment-gateway-sim:
    build:
      context: .
      dockerfile: apps/payment-gateway-sim/Dockerfile
    environment:
      GATEWAY_SIM_MODE: ${GATEWAY_SIM_MODE:-normal}
      GATEWAY_SIM_LATENCY_MS: ${GATEWAY_SIM_LATENCY_MS:-20}
      GATEWAY_SIM_SLOW_DELAY_MS: ${GATEWAY_SIM_SLOW_DELAY_MS:-3000}

  # T2-201/T2-202: Pagos, con timeout, Circuit Breaker y Bulkhead hacia la pasarela.
  payments-api:
    build:
      context: .
      dockerfile: apps/payments-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://payments:payments-local-only@payments-db:5432/payments?schema=public
      HOST: 0.0.0.0
      PORT: 3003
      PAYMENT_GATEWAY_URL: http://payment-gateway-sim:3010
      PAYMENTS_GATEWAY_TIMEOUT_MS: ${PAYMENTS_GATEWAY_TIMEOUT_MS:-1200}
      PAYMENTS_CIRCUIT_BREAKER_ENABLED: ${PAYMENTS_CIRCUIT_BREAKER_ENABLED:-true}
      PAYMENTS_BULKHEAD_ENABLED: ${PAYMENTS_BULKHEAD_ENABLED:-true}
      PAYMENTS_BULKHEAD_MAX_CONCURRENT: ${PAYMENTS_BULKHEAD_MAX_CONCURRENT:-8}
      PAYMENTS_CB_OPEN_MS: ${PAYMENTS_CB_OPEN_MS:-5000}
    depends_on:
      payments-db:
        condition: service_healthy
      payment-gateway-sim:
        condition: service_started

  # T2-401: único punto de entrada. Valida el JWT, enruta y limita por cliente.
  # Es el único servicio con puerto publicado en el host.
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      GATEWAY_SALES_BASE_URL: "http://sales-api:3000"
      GATEWAY_BFF_BASE_URL: "http://web-bff:3002"
      # Secreto sólo para la demo local (>= 32 bytes). Sustitúyelo fuera de una
      # máquina de desarrollo exportando GATEWAY_JWT_SECRET.
      GATEWAY_JWT_SECRET: "${GATEWAY_JWT_SECRET:-local-demo-jwt-secret-change-me-0123456789}"
      GATEWAY_JWT_ISSUER: "${GATEWAY_JWT_ISSUER:-repuestossur-demo}"
      GATEWAY_JWT_AUDIENCE: "${GATEWAY_JWT_AUDIENCE:-repuestossur-gateway}"
      GATEWAY_SALES_API_KEY_READER: "${API_KEY_READER:-local-reader-key-for-demo}"
      GATEWAY_SALES_API_KEY_OPERATOR: "${API_KEY_OPERATOR:-local-operator-key-for-demo}"
      GATEWAY_SALES_TIMEOUT_MS: "${GATEWAY_SALES_TIMEOUT_MS:-10000}"
      GATEWAY_BFF_TIMEOUT_MS: "${GATEWAY_BFF_TIMEOUT_MS:-2500}"
      GATEWAY_RATE_LIMIT_WINDOW_MS: "${GATEWAY_RATE_LIMIT_WINDOW_MS:-60000}"
      GATEWAY_RATE_LIMIT_MAX_REQUESTS: "${GATEWAY_RATE_LIMIT_MAX_REQUESTS:-60}"
      GATEWAY_RATE_LIMIT_MAX_IDENTITIES: "${GATEWAY_RATE_LIMIT_MAX_IDENTITIES:-10000}"
      GATEWAY_MAX_REQUEST_BODY_BYTES: "${GATEWAY_MAX_REQUEST_BODY_BYTES:-1048576}"
      GATEWAY_MAX_RESPONSE_BODY_BYTES: "${GATEWAY_MAX_RESPONSE_BODY_BYTES:-2097152}"
    ports:
      - "127.0.0.1:${GATEWAY_PUBLISHED_PORT:-8080}:8080"
    depends_on:
      sales-api:
        condition: service_healthy
      web-bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health', { signal: AbortSignal.timeout(2000) }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  # T2-401: BFF web. Compone en una respuesta el estado de Pagos y Despacho de
  # una venta. Interno: sólo el Gateway lo llama.
  web-bff:
    build:
      context: .
      dockerfile: apps/web-bff/Dockerfile
    environment:
      BFF_HOST: "0.0.0.0"
      BFF_PORT: "3002"
      BFF_PAYMENTS_BASE_URL: "${BFF_PAYMENTS_BASE_URL:-http://payments-api:3003}"
      BFF_DISPATCH_BASE_URL: "${BFF_DISPATCH_BASE_URL:-http://dispatch-api:3001}"
      BFF_SOURCE_TIMEOUT_MS: "${BFF_SOURCE_TIMEOUT_MS:-1500}"
      BFF_MAX_RESPONSE_BODY_BYTES: "${BFF_MAX_RESPONSE_BODY_BYTES:-2097152}"
    expose:
      - "3002"
    depends_on:
      payments-api:
        condition: service_healthy
      dispatch-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health', { signal: AbortSignal.timeout(2000) }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [experiment]
    command: ["-host=0.0.0.0"]
    ports:
      - "127.0.0.1:8474:8474"
    expose:
      - "50051"
    depends_on:
      inventory-grpc:
        condition: service_healthy

  sales-test-db:
    image: postgres:18.6-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: sales_test
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales-test-only
    ports:
      - "127.0.0.1:${SALES_TEST_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  payments-test-db:
    image: postgres:18.6-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: payments_test
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments-test-only
    ports:
      - "127.0.0.1:${PAYMENTS_TEST_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  # T2-203: generador de carga para experiments/payments (sólo con --profile payments-experiment).
  k6-payments:
    image: grafana/k6:${K6_VERSION:-2.4.0}
    profiles: [payments-experiment]
    volumes:
      - ./experiments/payments:/experiment
    working_dir: /experiment
    depends_on:
      payments-api:
        condition: service_healthy

volumes:
  sales-data-v18:
  inventory-data-v18:
  dispatch-data-v18:
  payments-data-v18:
