syntax = "proto3";

package repuestossur.inventory.v1;

import "google/protobuf/timestamp.proto";

// Internal source-of-truth service for parts and available stock.
service InventoryService {
  // Returns one part and its current available stock.
  rpc GetPart(GetPartRequest) returns (GetPartResponse);

  // Returns the complete inventory for this academic scope.
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);

  // Atomically validates and deducts stock for every item in an order.
  // The operation is idempotent by order_id.
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);

  // Restores all stock previously reserved for order_id.
  // The operation is idempotent by order_id.
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
}

message GetPartRequest {
  string part_id = 1;
}

message GetPartResponse {
  Part part = 1;
}

message ListPartsRequest {}

message ListPartsResponse {
  repeated Part parts = 1;
}

message Part {
  string id = 1;
  string sku = 2;
  string name = 3;
  int32 stock_available = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message StockItemRequest {
  string part_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  // UUID generated by Sales before invoking Inventory.
  string order_id = 1;
  repeated StockItemRequest items = 2;
}

message StockMutationItem {
  Part part = 1;
  int32 quantity = 2;
  int32 stock_before = 3;
  int32 stock_after = 4;
}

message ReserveStockResponse {
  string order_id = 1;
  repeated StockMutationItem items = 2;
  google.protobuf.Timestamp processed_at = 3;
  bool replayed = 4;
}

message ReleaseStockRequest {
  // Inventory reconstructs the original mutation from its own stock ledger.
  string order_id = 1;
}

message ReleaseStockResponse {
  string order_id = 1;
  repeated StockMutationItem items = 2;
  google.protobuf.Timestamp processed_at = 3;
  bool replayed = 4;
}